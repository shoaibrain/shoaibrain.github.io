<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Shoaib Rain</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {}
    })();
  </script>
  <style>
    .nf { max-width: 34rem; margin-inline: auto; padding: clamp(4rem, 15vw, 8rem) 1.5rem; text-align: center; }
    .nf h1 { font-size: clamp(3rem, 12vw, 5rem); margin-bottom: 0.5rem; }
    .nf p { color: var(--text-secondary); font-size: 1.15rem; margin: 0 0 1.75rem; }
  </style>
</head>
<body>
  <main class="nf">
    <h1>404</h1>
    <p>That page doesn't exist.</p>
    <a class="btn btn-primary" href="/">Back home</a>
  </main>
</body>
</html>
